<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151322">
  <title>心愿信局 · 情侣心愿扭蛋机</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="fonts/type.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cards.css">
</head>
<body>
  <canvas id="nightSky" aria-hidden="true"></canvas>
  <header class="mast">
    <div class="brand"><span class="brand-seal" aria-hidden="true">♥</span><span>心愿信局<small>WISH POST</small></span></div>
    <button class="archive-link" id="historyBtn"><i class="book-icon" aria-hidden="true"></i>心愿记录<span aria-hidden="true">↗</span></button>
  </header>
  <main class="hero">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">心愿<span>扭蛋机</span></h1>
      <p class="lead">把想和你做的小事，藏进一张心愿彩卡。</p>
      <div class="controls">
        <button id="writeBtn" class="button main-button"><i class="mail-icon" aria-hidden="true"></i>写张心愿</button>
        <button id="drawBtn" class="button secondary" disabled><i class="capsule-icon" aria-hidden="true"></i><span id="drawText">抽一颗</span></button>
      </div>
      <div class="counts" aria-label="心愿数量"><span>待抽 <b id="waiting">00</b></span><i></i><span>已抽 <b id="opened">00</b></span></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="stage" aria-label="心愿扭蛋器">
      <div id="machineView" aria-label="可转动的扭蛋器"></div>
      <div class="machine-caption" id="machineHint"><span></span>拖动旋转 · 点击旋钮抽取<span></span></div>
    </section>
  </main>
  <footer class="foot"><span><i aria-hidden="true" class="tiny-heart">♥</i> 岁物 · 双人版</span><span id="saveInfo">纸条保存在当前浏览器</span></footer>
  <dialog id="composer" aria-labelledby="composeTitle">
    <form class="paper compose" id="wishForm">
      <div class="paper-head"><span class="paper-mark"><i class="mail-icon"></i> 心愿信笺</span><button type="button" class="close" data-close aria-label="关闭">×</button></div>
      <h2 id="composeTitle">写张心愿</h2>
      <label for="wishBody">想一起做什么？</label>
      <textarea id="wishBody" rows="3" maxlength="200" placeholder="比如，选一个晴天，一起去海边看日落。" required></textarea>
      <div class="under"><button type="button" id="inspire" class="text-button">换个灵感 ↻</button><span id="length">0 / 200</span></div>
      <label for="sender">署名 <small>选填</small></label>
      <input id="sender" maxlength="24" placeholder="留空就匿名" autocomplete="off">
      <p id="saveError" hidden role="alert">这张纸条没能存好，请再试一次。</p>
      <div class="form-end compose-end"><small>投递时随机配一款卡面</small><button type="submit" id="deposit" class="button ink-button">封好，投进机器 <span aria-hidden="true">↗</span></button></div>
    </form>
  </dialog>
  <dialog id="letter" aria-labelledby="cardName">
    <div class="reveal-stage">
      <canvas id="prismBurst" aria-hidden="true"></canvas>
      <div class="card-space"><div id="cardTilt" class="card-tilt"><div class="card-turn">
        <article class="wish-card">
          <header class="card-brand">W I S H &nbsp; P O S T <small>心 愿 信 局</small></header>
          <div class="art-window"><img id="cardArt" alt=""><i class="art-rainbow" aria-hidden="true"></i><i class="art-print" aria-hidden="true"></i></div>
          <div class="wish-caption"><h2 id="cardName"></h2><div class="card-divider" aria-hidden="true">✧</div>
            <blockquote id="letterBody"></blockquote><p class="signature" id="letterFrom"></p>
          </div><div class="card-folio" id="cardFolio" lang="en"></div>
          <i class="rim-rainbow" aria-hidden="true"></i>
          <i class="foil-glint glint-north" aria-hidden="true"></i><i class="foil-glint glint-south" aria-hidden="true"></i>
        </article><div class="card-reverse" aria-hidden="true"></div>
      </div></div></div>
      <button class="button keep-card" id="keepCard" data-close>收好彩卡</button>
    </div>
  </dialog>
  <dialog id="journal" aria-labelledby="journalTitle">
    <div class="paper journal-paper"><div class="paper-head"><span class="paper-mark"><i class="book-icon"></i> 双人手记</span><button class="close" data-close aria-label="关闭">×</button></div>
      <h2 id="journalTitle">心愿记录</h2>
      <div id="entries"></div>
      <p id="noEntries">还没有抽到彩卡。抽过的心愿都会收在这里。</p>
    </div>
  </dialog>
  <script src="vendor/three.min.js"></script><script src="machine.js"></script><script src="stage.js"></script><script src="night.js"></script><script src="cards.js"></script><script src="store.js"></script><script src="app.js"></script>
</body>
</html>
